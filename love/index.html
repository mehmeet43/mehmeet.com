<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>❤️</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="love-page">

        <!-- Photo -->
        <div id="photo-frame" class="photo-frame">
            <img
                id="love-photo"
                class="love-photo"
                src=""
                alt=""
            >
        </div>


        <!-- Board -->
        <div class="board">

            <div class="names">
                Ç. <span class="heart">❤️</span> Ş.
            </div>

            <div
                id="love-counter"
                class="counter"
                aria-label="Sevgi sayacı"
            >
                0
            </div>

        </div>

    </main>


    <script>

        /*
         * --------------------------------------------------
         * Sevgi Sayacı
         * --------------------------------------------------
         *
         * Ölçüm 1
         * 22.08.2026 04:46 TRT
         * 16.255.000.000
         *
         * Ölçüm 2
         * 23.08.2026 12:56 TRT
         * 17.105.527.318
         */

        const firstObservation = {
            time: new Date(
                "2026-08-22T04:46:00+03:00"
            ).getTime(),

            value: 16255000000
        };


        const secondObservation = {
            time: new Date(
                "2026-08-23T12:56:00+03:00"
            ).getTime(),

            value: 17105527318
        };


        const elapsedSeconds =
            (
                secondObservation.time -
                firstObservation.time
            ) / 1000;


        const growthPerSecond =
            (
                secondObservation.value -
                firstObservation.value
            ) / elapsedSeconds;


        const counter =
            document.getElementById("love-counter");


        function currentLoveValue() {

            const secondsSinceLastObservation =
                (
                    Date.now() -
                    secondObservation.time
                ) / 1000;


            return Math.floor(
                secondObservation.value +
                (
                    secondsSinceLastObservation *
                    growthPerSecond
                )
            );
        }


        function updateCounter() {

            counter.textContent =
                currentLoveValue()
                    .toLocaleString("tr-TR");
        }


        updateCounter();

        setInterval(
            updateCounter,
            1000
        );



        /*
         * --------------------------------------------------
         * Fotoğraflar
         * --------------------------------------------------
         */

        const photos = [];


        // 19 dikey

        for (let i = 1; i <= 19; i++) {

            photos.push({
                src:
                    `photos/dikey-${String(i).padStart(2, "0")}.jpg`,

                orientation: "portrait"
            });
        }


        // 13 yatay

        for (let i = 1; i <= 13; i++) {

            photos.push({
                src:
                    `photos/yatay-${String(i).padStart(2, "0")}.jpg`,

                orientation: "landscape"
            });
        }



        /*
         * --------------------------------------------------
         * Galeri
         * --------------------------------------------------
         */

        const photo =
            document.getElementById("love-photo");

        const photoFrame =
            document.getElementById("photo-frame");


        let currentIndex = -1;

        let changingPhoto = false;



        function getRandomIndex() {

            if (photos.length === 1) {
                return 0;
            }


            let index;


            do {

                index =
                    Math.floor(
                        Math.random() *
                        photos.length
                    );

            } while (
                index === currentIndex
            );


            return index;
        }



        function setOrientation(orientation) {

            photoFrame.classList.remove(
                "portrait",
                "landscape"
            );


            photoFrame.classList.add(
                orientation
            );
        }



        function changePhoto(immediate = false) {

            if (changingPhoto) {
                return;
            }


            changingPhoto = true;


            const nextIndex =
                getRandomIndex();


            const nextPhoto =
                photos[nextIndex];


            /*
             * Sadece sıradaki fotoğrafı yükle.
             * 32 fotoğrafı birden indirmiyoruz.
             */

            const loader =
                new Image();


            loader.onload = () => {

                const showPhoto = () => {

                    setOrientation(
                        nextPhoto.orientation
                    );


                    photo.src =
                        nextPhoto.src;


                    currentIndex =
                        nextIndex;


                    requestAnimationFrame(() => {

                        photo.classList.add(
                            "visible"
                        );

                        changingPhoto = false;
                    });
                };


                if (immediate) {

                    showPhoto();

                    return;
                }


                /*
                 * Önce eski fotoğrafı soldur.
                 */

                photo.classList.remove(
                    "visible"
                );


                /*
                 * Fade bittikten sonra
                 * yenisini göster.
                 */

                setTimeout(
                    showPhoto,
                    700
                );
            };


            loader.onerror = () => {

                changingPhoto = false;

                /*
                 * Bir dosya bulunamazsa
                 * galeriyi tamamen durdurma.
                 */

                setTimeout(
                    () => changePhoto(),
                    1000
                );
            };


            loader.src =
                nextPhoto.src;
        }



        /*
         * İlk fotoğraf
         */

        changePhoto(true);



        /*
         * 30 saniyede bir değiştir.
         */

        setInterval(
            () => changePhoto(),
            30000
        );


        /*
         * Sekme arka plandayken gereksiz
         * fotoğraf değiştirmeyelim.
         */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState === "visible" &&
                    !photo.src
                ) {
                    changePhoto(true);
                }
            }
        );

    </script>

</body>
</html>
