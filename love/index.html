<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>❤️</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="love-page">

        <!-- Fotoğraf -->
        <button
            id="photo-frame"
            class="photo-frame"
            type="button"
            aria-label="fotoğrafın hikâyesini oku"
        >

            <img
                id="love-photo"
                class="love-photo"
                src=""
                alt=""
            >

            <!-- Metin varsa görünür -->
            <div
                id="story-hint"
                class="story-hint"
                aria-hidden="true"
            >
                · · ·
            </div>

        </button>


        <!-- Tahta -->
        <div class="board">

            <div class="names">
                ç. <span class="heart">❤️</span> ş.
            </div>

            <div
                id="love-counter"
                class="counter"
                aria-label="sevgi sayacı"
            >
                0
            </div>

        </div>

    </main>


    <!-- ==================================================
         HİKÂYE
    =================================================== -->

    <div
        id="story-overlay"
        class="story-overlay"
        aria-hidden="true"
    >

        <div class="story-panel">

            <button
                id="story-close"
                class="story-close"
                type="button"
                aria-label="kapat"
            >
                ×
            </button>

            <div
                id="story-text"
                class="story-text"
            ></div>

        </div>

    </div>


    <script>

        /*
         * ==================================================
         * SEVGİ SAYACI
         * ==================================================
         */

        const firstObservation = {

            time: new Date(
                "2026-08-22T04:46:00+03:00"
            ).getTime(),

            value: 16255000000
        };


        const secondObservation = {

            time: new Date(
                "2026-08-23T12:56:00+03:00"
            ).getTime(),

            value: 17105527318
        };


        const elapsedSeconds =
            (
                secondObservation.time -
                firstObservation.time
            ) / 1000;


        const growthPerSecond =
            (
                secondObservation.value -
                firstObservation.value
            ) / elapsedSeconds;


        const counter =
            document.getElementById(
                "love-counter"
            );


        function currentLoveValue() {

            const secondsSinceLastObservation =
                (
                    Date.now() -
                    secondObservation.time
                ) / 1000;


            return Math.floor(

                secondObservation.value +

                (
                    secondsSinceLastObservation *
                    growthPerSecond
                )
            );
        }


        function updateCounter() {

            counter.textContent =
                currentLoveValue()
                    .toLocaleString("tr-TR");
        }


        updateCounter();

        setInterval(
            updateCounter,
            1000
        );



        /*
         * ==================================================
         * FOTOĞRAFLAR
         * ==================================================
         */

        const photos = [];


        for (let i = 1; i <= 19; i++) {

            const name =
                `dikey-${String(i).padStart(2, "0")}`;


            photos.push({

                name: name,

                src:
                    `photos/${name}.jpg`,

                text:
                    `photos/${name}.txt`,

                orientation:
                    "portrait"
            });
        }


        for (let i = 1; i <= 13; i++) {

            const name =
                `yatay-${String(i).padStart(2, "0")}`;


            photos.push({

                name: name,

                src:
                    `photos/${name}.jpg`,

                text:
                    `photos/${name}.txt`,

                orientation:
                    "landscape"
            });
        }



        /*
         * ==================================================
         * SHUFFLE
         * ==================================================
         */

        function shuffledPhotos() {

            const shuffled =
                [...photos];


            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    shuffled[i],
                    shuffled[j]
                ] = [
                    shuffled[j],
                    shuffled[i]
                ];
            }


            return shuffled;
        }


        let photoQueue =
            shuffledPhotos();


        let lastPhoto = null;


        function refillQueue() {

            photoQueue =
                shuffledPhotos();


            /*
             * Yeni turun ilk fotoğrafı
             * önceki turun son fotoğrafıyla
             * aynı olmasın.
             */

            if (
                lastPhoto &&
                photoQueue.length > 1 &&
                photoQueue[0].src === lastPhoto.src
            ) {

                [
                    photoQueue[0],
                    photoQueue[1]
                ] = [
                    photoQueue[1],
                    photoQueue[0]
                ];
            }
        }


        function getNextPhoto() {

            if (photoQueue.length === 0) {

                refillQueue();
            }


            const nextPhoto =
                photoQueue.shift();


            lastPhoto =
                nextPhoto;


            return nextPhoto;
        }



        /*
         * ==================================================
         * GALERİ
         * ==================================================
         */

        const photo =
            document.getElementById(
                "love-photo"
            );


        const photoFrame =
            document.getElementById(
                "photo-frame"
            );


        const storyHint =
            document.getElementById(
                "story-hint"
            );


        let currentPhoto = null;

        let currentStory = null;

        let changingPhoto = false;



        function setOrientation(
            orientation
        ) {

            photoFrame.classList.remove(
                "portrait",
                "landscape"
            );


            photoFrame.classList.add(
                orientation
            );
        }



        /*
         * Fotoğrafın .txt dosyasını kontrol et.
         */

        async function loadStory(
            photoInfo
        ) {

            currentStory = null;

            storyHint.classList.remove(
                "visible"
            );


            try {

                const response =
                    await fetch(
                        photoInfo.text,
                        {
                            cache: "no-cache"
                        }
                    );


                if (!response.ok) {
                    return;
                }


                const text =
                    (
                        await response.text()
                    ).trim();


                if (!text) {
                    return;
                }


                /*
                 * Bu sırada fotoğraf değişmiş
                 * olabilir.
                 */

                if (
                    !currentPhoto ||
                    currentPhoto.name !== photoInfo.name
                ) {
                    return;
                }


                currentStory =
                    text;


                storyHint.classList.add(
                    "visible"
                );

            } catch {

                /*
                 * .txt yoksa hiçbir şey yapma.
                 */

            }
        }



        function changePhoto(
            immediate = false
        ) {

            if (changingPhoto) {
                return;
            }


            /*
             * Hikâye açıkken fotoğraf değiştirme.
             */

            if (
                document.body.classList.contains(
                    "story-open"
                )
            ) {
                return;
            }


            changingPhoto =
                true;


            const nextPhoto =
                getNextPhoto();


            const loader =
                new Image();


            loader.onload = () => {


                const showPhoto = () => {

                    setOrientation(
                        nextPhoto.orientation
                    );


                    photo.src =
                        nextPhoto.src;


                    currentPhoto =
                        nextPhoto;


                    /*
                     * Bu fotoğrafın metni
                     * var mı kontrol et.
                     */

                    loadStory(
                        nextPhoto
                    );


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    photo.classList.add(
                                        "visible"
                                    );


                                    changingPhoto =
                                        false;
                                }
                            );
                        }
                    );
                };


                if (immediate) {

                    showPhoto();

                    return;
                }


                photo.classList.remove(
                    "visible"
                );


                storyHint.classList.remove(
                    "visible"
                );


                setTimeout(
                    showPhoto,
                    700
                );
            };


            loader.onerror = () => {

                changingPhoto =
                    false;


                setTimeout(
                    () => changePhoto(),
                    500
                );
            };


            loader.src =
                nextPhoto.src;
        }



        /*
         * ==================================================
         * HİKÂYE OVERLAY
         * ==================================================
         */

        const storyOverlay =
            document.getElementById(
                "story-overlay"
            );


        const storyText =
            document.getElementById(
                "story-text"
            );


        const storyClose =
            document.getElementById(
                "story-close"
            );



        function openStory() {

            if (!currentStory) {
                return;
            }


            /*
             * textContent kullanıyoruz.
             * .txt içindeki metin HTML olarak
             * çalıştırılmıyor.
             */

            storyText.textContent =
                currentStory;


            storyOverlay.classList.add(
                "visible"
            );


            storyOverlay.setAttribute(
                "aria-hidden",
                "false"
            );


            document.body.classList.add(
                "story-open"
            );
        }



        function closeStory() {

            storyOverlay.classList.remove(
                "visible"
            );


            storyOverlay.setAttribute(
                "aria-hidden",
                "true"
            );


            document.body.classList.remove(
                "story-open"
            );
        }



        photoFrame.addEventListener(
            "click",
            openStory
        );


        storyClose.addEventListener(
            "click",
            closeStory
        );


        /*
         * Panelin dışına dokununca kapat.
         */

        storyOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    storyOverlay
                ) {

                    closeStory();
                }
            }
        );


        /*
         * Bilgisayarda ESC.
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeStory();
                }
            }
        );



        /*
         * ==================================================
         * BAŞLAT
         * ==================================================
         */

        changePhoto(true);


        /*
         * Her 30 saniyede bir.
         */

        setInterval(

            () => {

                if (
                    document.visibilityState ===
                    "visible" &&

                    !document.body.classList.contains(
                        "story-open"
                    )
                ) {

                    changePhoto();
                }
            },

            30000
        );

    </script>

</body>
</html>
