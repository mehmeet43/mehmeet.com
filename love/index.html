<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>❤️</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main
        id="love-page"
        class="love-page"
    >

        <!-- FOTOĞRAF -->

        <button
            id="photo-frame"
            class="photo-frame portrait"
            type="button"
            aria-label="fotoğraf"
        >

            <img
                id="love-photo"
                class="love-photo"
                src=""
                alt=""
            >

        </button>


        <!-- TAHTA -->

        <div class="board">

            <div class="names">
                ç. <span class="heart">❤️</span> ş.
            </div>

            <div
                id="love-counter"
                class="counter"
                aria-label="sevgi sayacı"
            >
                0
            </div>

        </div>

    </main>



    <!-- HİKÂYE -->

    <div
        id="story-overlay"
        class="story-overlay"
        aria-hidden="true"
    >

        <div class="story-panel">

            <button
                id="story-close"
                class="story-close"
                type="button"
                aria-label="kapat"
            >
                ×
            </button>

            <div
                id="story-text"
                class="story-text"
            ></div>

        </div>

    </div>



    <script>

        /*
         * ==================================================
         * SEVGİ SAYACI
         * ==================================================
         */

        const firstObservation = {
            time: new Date(
                "2026-08-22T04:46:00+03:00"
            ).getTime(),

            value: 16255000000
        };


        const secondObservation = {
            time: new Date(
                "2026-08-23T12:56:00+03:00"
            ).getTime(),

            value: 17105527318
        };


        const elapsedSeconds =
            (
                secondObservation.time -
                firstObservation.time
            ) / 1000;


        const growthPerSecond =
            (
                secondObservation.value -
                firstObservation.value
            ) / elapsedSeconds;


        const counter =
            document.getElementById(
                "love-counter"
            );


        function currentLoveValue() {

            const secondsSinceLastObservation =
                (
                    Date.now() -
                    secondObservation.time
                ) / 1000;


            return Math.floor(
                secondObservation.value +
                (
                    secondsSinceLastObservation *
                    growthPerSecond
                )
            );
        }


        function updateCounter() {

            counter.textContent =
                currentLoveValue()
                    .toLocaleString("tr-TR");
        }


        updateCounter();

        setInterval(
            updateCounter,
            1000
        );



        /*
         * ==================================================
         * FOTOĞRAFLAR
         * ==================================================
         */

        const photos = [];


        /*
         * 19 dikey
         */

        for (let i = 1; i <= 19; i++) {

            const name =
                `dikey-${String(i).padStart(2, "0")}`;


            photos.push({

                name: name,

                src:
                    `photos/${name}.jpg`,

                text:
                    `photos/${name}.txt`,

                orientation:
                    "portrait"
            });
        }


        /*
         * 13 yatay
         */

        for (let i = 1; i <= 13; i++) {

            const name =
                `yatay-${String(i).padStart(2, "0")}`;


            photos.push({

                name: name,

                src:
                    `photos/${name}.jpg`,

                text:
                    `photos/${name}.txt`,

                orientation:
                    "landscape"
            });
        }



        /*
         * ==================================================
         * SHUFFLE
         * ==================================================
         *
         * 32 fotoğrafın tamamı gösterilmeden
         * hiçbiri tekrar etmez.
         */

        function shuffledPhotos() {

            const array =
                [...photos];


            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];
            }


            return array;
        }


        let photoQueue =
            shuffledPhotos();


        let lastPhoto =
            null;


        function refillQueue() {

            photoQueue =
                shuffledPhotos();


            /*
             * Yeni turun ilk fotoğrafı,
             * önceki turun sonuncusu olmasın.
             */

            if (
                lastPhoto &&
                photoQueue.length > 1 &&
                photoQueue[0].src === lastPhoto.src
            ) {

                [
                    photoQueue[0],
                    photoQueue[1]
                ] = [
                    photoQueue[1],
                    photoQueue[0]
                ];
            }
        }


        function getNextPhoto() {

            if (
                photoQueue.length === 0
            ) {

                refillQueue();
            }


            const nextPhoto =
                photoQueue.shift();


            lastPhoto =
                nextPhoto;


            return nextPhoto;
        }



        /*
         * ==================================================
         * ELEMENTLER
         * ==================================================
         */

        const lovePage =
            document.getElementById(
                "love-page"
            );


        const photoFrame =
            document.getElementById(
                "photo-frame"
            );


        const photo =
            document.getElementById(
                "love-photo"
            );


        const board =
            document.querySelector(
                ".board"
            );


        const storyOverlay =
            document.getElementById(
                "story-overlay"
            );


        const storyPanel =
            document.querySelector(
                ".story-panel"
            );


        const storyText =
            document.getElementById(
                "story-text"
            );


        const storyClose =
            document.getElementById(
                "story-close"
            );



        /*
         * ==================================================
         * DURUM
         * ==================================================
         */

        let currentPhoto =
            null;


        let currentStory =
            null;


        let changingPhoto =
            false;



        /*
         * ==================================================
         * FOTOĞRAF YÖNÜ
         * ==================================================
         */

        function setOrientation(
            orientation
        ) {

            photoFrame.classList.remove(
                "portrait",
                "landscape"
            );


            photoFrame.classList.add(
                orientation
            );
        }



        /*
         * ==================================================
         * METNİ YÜKLE
         * ==================================================
         *
         * Aynı isimli .txt yoksa:
         *
         * currentStory = null
         *
         * ve fotoğrafa tıklanınca
         * hiçbir şey olmaz.
         */

        async function loadStory(
            photoInfo
        ) {

            currentStory =
                null;


            try {

                const response =
                    await fetch(
                        photoInfo.text,
                        {
                            cache: "no-cache"
                        }
                    );


                if (!response.ok) {

                    return;
                }


                const text =
                    (
                        await response.text()
                    ).trim();


                if (!text) {

                    return;
                }


                /*
                 * Fetch sürerken başka
                 * fotoğrafa geçmiş olabiliriz.
                 */

                if (
                    !currentPhoto ||
                    currentPhoto.name !==
                    photoInfo.name
                ) {

                    return;
                }


                currentStory =
                    text;


            } catch {

                /*
                 * .txt yok.
                 *
                 * Hiçbir şey gösterme.
                 */

                currentStory =
                    null;
            }
        }



        /*
         * ==================================================
         * FOTOĞRAFI DEĞİŞTİR
         * ==================================================
         */

        function changePhoto(
            immediate = false
        ) {

            if (changingPhoto) {

                return;
            }


            /*
             * Yazı okunurken değiştirme.
             */

            if (
                document.body.classList.contains(
                    "story-open"
                )
            ) {

                return;
            }


            changingPhoto =
                true;


            const nextPhoto =
                getNextPhoto();


            const loader =
                new Image();


            loader.onload = () => {


                const showPhoto = () => {

                    /*
                     * Önce eski metni unut.
                     */

                    currentStory =
                        null;


                    setOrientation(
                        nextPhoto.orientation
                    );


                    photo.src =
                        nextPhoto.src;


                    currentPhoto =
                        nextPhoto;


                    /*
                     * Aynı isimli .txt var mı?
                     */

                    loadStory(
                        nextPhoto
                    );


                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    photo.classList.add(
                                        "visible"
                                    );


                                    changingPhoto =
                                        false;
                                }
                            );
                        }
                    );
                };


                /*
                 * İlk fotoğraf
                 */

                if (immediate) {

                    showPhoto();

                    return;
                }


                /*
                 * Önce eski fotoğrafı soldur.
                 */

                photo.classList.remove(
                    "visible"
                );


                /*
                 * Sonra yenisini getir.
                 */

                setTimeout(
                    showPhoto,
                    700
                );
            };


            /*
             * Fotoğraf dosyası yoksa
             * galeriyi durdurma.
             */

            loader.onerror = () => {

                changingPhoto =
                    false;


                setTimeout(
                    () => changePhoto(),
                    500
                );
            };


            loader.src =
                nextPhoto.src;
        }



        /*
         * ==================================================
         * HİKÂYE
         * ==================================================
         */

        function openStory() {

            /*
             * Metin yoksa:
             *
             * HİÇBİR ŞEY YAPMA.
             */

            if (!currentStory) {

                return;
            }


            storyText.textContent =
                currentStory;


            document.body.classList.add(
                "story-open"
            );


            storyOverlay.classList.add(
                "visible"
            );


            storyOverlay.setAttribute(
                "aria-hidden",
                "false"
            );
        }


        function closeStory() {

            storyOverlay.classList.remove(
                "visible"
            );


            storyOverlay.setAttribute(
                "aria-hidden",
                "true"
            );


            document.body.classList.remove(
                "story-open"
            );
        }



        /*
         * ==================================================
         * ETKİLEŞİM
         * ==================================================
         */


        /*
         * FOTOĞRAFA TIKLA
         *
         * Metin varsa aç.
         * Metin yoksa hiçbir şey yapma.
         */

        photoFrame.addEventListener(
            "click",
            event => {

                /*
                 * Bu tıklamanın lovePage'e
                 * ulaşmasını engelliyoruz.
                 *
                 * Böylece metin yoksa bile
                 * fotoğraf değişmez.
                 */

                event.stopPropagation();


                openStory();
            }
        );



        /*
         * TAHTAYA TIKLA
         *
         * Hiçbir şey yapma.
         */

        board.addEventListener(
            "click",
            event => {

                event.stopPropagation();
            }
        );



        /*
         * BOŞ KREM ALANA TIKLA
         *
         * Sonraki fotoğrafa geç.
         */

        lovePage.addEventListener(
            "click",
            () => {

                changePhoto();
            }
        );



        /*
         * X'e tıkla.
         */

        storyClose.addEventListener(
            "click",
            event => {

                event.stopPropagation();


                closeStory();
            }
        );



        /*
         * Yazının üzerine tıklayınca
         * hiçbir şey yapma.
         */

        storyPanel.addEventListener(
            "click",
            event => {

                event.stopPropagation();
            }
        );



        /*
         * Yazının DIŞINDAKİ
         * karanlık alana tıkla:
         *
         * kapat.
         */

        storyOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    storyOverlay
                ) {

                    closeStory();
                }
            }
        );



        /*
         * Bilgisayarda ESC.
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeStory();
                }
            }
        );



        /*
         * ==================================================
         * BAŞLAT
         * ==================================================
         */

        changePhoto(true);



        /*
         * ==================================================
         * OTOMATİK DEĞİŞİM
         * ==================================================
         *
         * Her 30 saniyede bir.
         */

        setInterval(

            () => {

                /*
                 * Sekme açıksa
                 * ve yazı okunmuyorsa.
                 */

                if (
                    document.visibilityState ===
                    "visible" &&

                    !document.body.classList.contains(
                        "story-open"
                    )
                ) {

                    changePhoto();
                }
            },

            30000
        );


    </script>

</body>

</html>
