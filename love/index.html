<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>❤️</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="love-page">

        <!-- Fotoğraf -->
        <div id="photo-frame" class="photo-frame">

            <img
                id="love-photo"
                class="love-photo"
                src=""
                alt=""
            >

        </div>


        <!-- Tahta -->
        <div class="board">

            <div class="names">
                Ç. <span class="heart">❤️</span> Ş.
            </div>

            <div
                id="love-counter"
                class="counter"
                aria-label="Sevgi sayacı"
            >
                0
            </div>

        </div>

    </main>


    <script>

        /*
         * ==================================================
         * SEVGİ SAYACI
         * ==================================================
         *
         * Ölçüm 1
         * 22.08.2026 04:46 TRT
         * 16.255.000.000
         *
         * Ölçüm 2
         * 23.08.2026 12:56 TRT
         * 17.105.527.318
         */

        const firstObservation = {

            time: new Date(
                "2026-08-22T04:46:00+03:00"
            ).getTime(),

            value: 16255000000
        };


        const secondObservation = {

            time: new Date(
                "2026-08-23T12:56:00+03:00"
            ).getTime(),

            value: 17105527318
        };


        /*
         * İki ölçüm arasındaki gerçek artıştan
         * saniyelik sevgi hızını hesapla.
         */

        const elapsedSeconds =
            (
                secondObservation.time -
                firstObservation.time
            ) / 1000;


        const growthPerSecond =
            (
                secondObservation.value -
                firstObservation.value
            ) / elapsedSeconds;


        const counter =
            document.getElementById(
                "love-counter"
            );


        function currentLoveValue() {

            const secondsSinceLastObservation =
                (
                    Date.now() -
                    secondObservation.time
                ) / 1000;


            return Math.floor(

                secondObservation.value +

                (
                    secondsSinceLastObservation *
                    growthPerSecond
                )
            );
        }


        function updateCounter() {

            counter.textContent =
                currentLoveValue()
                    .toLocaleString("tr-TR");
        }


        /*
         * İlk değeri hemen göster.
         */

        updateCounter();


        /*
         * Sayacı saniyede bir güncelle.
         */

        setInterval(
            updateCounter,
            1000
        );



        /*
         * ==================================================
         * FOTOĞRAFLAR
         * ==================================================
         */

        const photos = [];


        /*
         * 19 dikey fotoğraf
         */

        for (let i = 1; i <= 19; i++) {

            photos.push({

                src:
                    `photos/dikey-${String(i).padStart(2, "0")}.jpg`,

                orientation:
                    "portrait"
            });
        }


        /*
         * 13 yatay fotoğraf
         */

        for (let i = 1; i <= 13; i++) {

            photos.push({

                src:
                    `photos/yatay-${String(i).padStart(2, "0")}.jpg`,

                orientation:
                    "landscape"
            });
        }



        /*
         * ==================================================
         * SHUFFLE
         * ==================================================
         *
         * Bir tur içerisinde hiçbir fotoğraf
         * ikinci kez gösterilmez.
         */

        function shuffledPhotos() {

            const shuffled =
                [...photos];


            /*
             * Fisher-Yates shuffle
             */

            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    shuffled[i],
                    shuffled[j]
                ] = [
                    shuffled[j],
                    shuffled[i]
                ];
            }


            return shuffled;
        }



        /*
         * İlk turu oluştur.
         */

        let photoQueue =
            shuffledPhotos();


        /*
         * Bir önceki fotoğrafı da tutuyoruz.
         *
         * Böylece yeni tur başladığında,
         * önceki turun son fotoğrafının
         * hemen tekrar gelmesini engelleriz.
         */

        let lastPhoto = null;



        function refillQueue() {

            photoQueue =
                shuffledPhotos();


            /*
             * Yeni turun ilk fotoğrafı,
             * önceki turun son fotoğrafıysa
             * başka bir fotoğrafla yer değiştir.
             */

            if (
                lastPhoto &&
                photoQueue.length > 1 &&
                photoQueue[0].src === lastPhoto.src
            ) {

                const swapIndex = 1;


                [
                    photoQueue[0],
                    photoQueue[swapIndex]
                ] = [
                    photoQueue[swapIndex],
                    photoQueue[0]
                ];
            }
        }



        function getNextPhoto() {

            /*
             * 32 fotoğraf bittiyse
             * yeni bir rastgele tur oluştur.
             */

            if (photoQueue.length === 0) {

                refillQueue();
            }


            const nextPhoto =
                photoQueue.shift();


            lastPhoto =
                nextPhoto;


            return nextPhoto;
        }



        /*
         * ==================================================
         * GALERİ
         * ==================================================
         */

        const photo =
            document.getElementById(
                "love-photo"
            );


        const photoFrame =
            document.getElementById(
                "photo-frame"
            );


        let changingPhoto = false;



        function setOrientation(
            orientation
        ) {

            photoFrame.classList.remove(
                "portrait",
                "landscape"
            );


            photoFrame.classList.add(
                orientation
            );
        }



        function changePhoto(
            immediate = false
        ) {

            /*
             * Önceki transition henüz
             * bitmediyse yeni transition başlatma.
             */

            if (changingPhoto) {
                return;
            }


            changingPhoto = true;


            const nextPhoto =
                getNextPhoto();


            /*
             * Sadece sıradaki fotoğrafı
             * önceden yükle.
             *
             * 32 fotoğrafın tamamını
             * başlangıçta indirmiyoruz.
             */

            const loader =
                new Image();


            loader.onload = () => {


                /*
                 * Yeni fotoğrafı ekrana koy.
                 */

                const showPhoto = () => {

                    setOrientation(
                        nextPhoto.orientation
                    );


                    photo.src =
                        nextPhoto.src;


                    /*
                     * Browser yeni src'yi çizdikten
                     * sonra fade-in başlat.
                     */

                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                () => {

                                    photo.classList.add(
                                        "visible"
                                    );

                                    changingPhoto =
                                        false;
                                }
                            );
                        }
                    );
                };


                /*
                 * Sayfa ilk açıldığında
                 * fade-out gerekmiyor.
                 */

                if (immediate) {

                    showPhoto();

                    return;
                }


                /*
                 * Mevcut fotoğrafı soldur.
                 */

                photo.classList.remove(
                    "visible"
                );


                /*
                 * Fade-out tamamlandıktan sonra
                 * yeni fotoğrafı yerleştir.
                 */

                setTimeout(
                    showPhoto,
                    700
                );
            };



            /*
             * Fotoğraf dosyasında sorun varsa
             * galerinin tamamen durmasını engelle.
             */

            loader.onerror = () => {

                changingPhoto = false;


                setTimeout(
                    () => changePhoto(),
                    500
                );
            };


            /*
             * Yüklemeyi başlat.
             */

            loader.src =
                nextPhoto.src;
        }



        /*
         * ==================================================
         * BAŞLAT
         * ==================================================
         */


        /*
         * İlk fotoğrafı hemen göster.
         */

        changePhoto(true);



        /*
         * Her 30 saniyede
         * yeni fotoğraf.
         */

        setInterval(

            () => {

                /*
                 * Sekme görünür durumdaysa değiştir.
                 *
                 * Arka planda gereksiz fotoğraf
                 * indirmiyoruz.
                 */

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    changePhoto();
                }
            },

            30000
        );


    </script>

</body>
</html>
